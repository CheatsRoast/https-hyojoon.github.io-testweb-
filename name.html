<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감사 인사</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;

    background-image:url("./imga/mrrrrrrr.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
}

.message{
    padding:30px 50px;

    background:rgba(0,0,0,0.4);

    color:white;
    font-size:3rem;
    font-weight:bold;

    border-radius:20px;

    text-align:center;

    text-shadow:
        2px 2px 5px black,
        0 0 10px black;
}
</style>

</head>
<body>

<div class="message">
    1학기 동안 많이 배웠습니다.<br>
    감사합니다.
</div>

</body>
</html>
